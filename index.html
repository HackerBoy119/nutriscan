    // Frecuencias semanales de entrenamiento

    // 2. Nivel de Actividad Física (Cotidiana / Ocupacional / Pasos diarios)

    function App() {
      const [activeTab, setActiveTab] = useState("diario");
      
      const [apiKey, setApiKey] = useState(() => {
        return CLAVE_FIJA_OPCIONAL || localStorage.getItem("nutriscan_apikey") || "";
      });
      const [modelName, setModelName] = useState(() => {
        return localStorage.getItem("nutriscan_model") || MODELO_POR_DEFECTO;
      });
      const [showKeyModal, setShowKeyModal] = useState(false);

      const [meals, setMeals] = useState(() => {
        const saved = localStorage.getItem("nutriscan_meals");
        return saved ? JSON.parse(saved) : [
          { id: 1, name: "2 Huevos, pan integral, 1/2 palta", category: "Desayuno", calories: 340, protein: 18, carbs: 30, fat: 16, time: "08:30" },
          { id: 2, name: "Pechuga de pollo, arroz, ensalada", category: "Almuerzo", calories: 520, protein: 48, carbs: 55, fat: 11, time: "13:15" }
        ];
      });

      const [goals, setGoals] = useState(() => {
        const saved = localStorage.getItem("nutriscan_goals");
        return saved ? JSON.parse(saved) : { calories: 2000, protein: 120, carbs: 220, fat: 65 };
      });

      // Perfil con género, deporte/ejercicio y actividad física seleccionables por separado
      const [profile, setProfile] = useState(() => {
        const defaultProfile = {
          gender: "male",
          age: 22,
          weight: 70,
          height: 170,
          exercise: "gym",
          exerciseDays: 3,
          dailyActivity: "light",
          activity: 1.55,
          objective: "maintain",
          weeklyLossKg: 0.5
        };
        const saved = localStorage.getItem("nutriscan_profile");
        if (!saved) return defaultProfile;
        try {
          const parsed = JSON.parse(saved);
          let ex = parsed.exercise;
          if (ex === "moderate") ex = "gym";
          else if (ex === "light") ex = "walking";
          else if (ex === "intense") ex = "crossfit";
          else if (!ex) ex = "gym";

          let days = Number(parsed.exerciseDays) || 3;
          let daily = parsed.dailyActivity || "light";
          let weeklyLoss = parsed.weeklyLossKg !== undefined ? (parsed.weeklyLossKg === "" ? "" : Number(parsed.weeklyLossKg)) : 0.5;
          if (weeklyLoss !== "" && isNaN(weeklyLoss)) weeklyLoss = 0.5;

          return {
            ...defaultProfile,
            ...parsed,
            exercise: ex,
            exerciseDays: days,
            dailyActivity: daily,
            weeklyLossKg: weeklyLoss
          };
        } catch (e) {
          return defaultProfile;
        }
      });

      const [isScanning, setIsScanning] = useState(false);
      const [statusText, setStatusText] = useState("Analizando nutrientes con IA...");
      const [scanResult, setScanResult] = useState(null);
      const [errorMsg, setErrorMsg] = useState("");
      const [selectedCategory, setSelectedCategory] = useState("Almuerzo");
      const [textPrompt, setTextPrompt] = useState("");
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedFoodGroup, setSelectedFoodGroup] = useState("Todos");

      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const [cameraActive, setCameraActive] = useState(false);

      useEffect(() => {
        localStorage.setItem("nutriscan_meals", JSON.stringify(meals));
      }, [meals]);

      useEffect(() => {
        localStorage.setItem("nutriscan_goals", JSON.stringify(goals));
      }, [goals]);

      useEffect(() => {
        localStorage.setItem("nutriscan_profile", JSON.stringify(profile));
      }, [profile]);

      const saveConfig = (newKey, newModel) => {
        const trimmedKey = newKey.trim();
        const trimmedModel = (newModel || MODELO_POR_DEFECTO).trim().replace(/^models\//, "");
        setApiKey(trimmedKey);
        setModelName(trimmedModel);
        localStorage.setItem("nutriscan_apikey", trimmedKey);
        localStorage.setItem("nutriscan_model", trimmedModel);
        setShowKeyModal(false);
        setErrorMsg("");
      };

      const totals = meals.reduce(
        (acc, item) => ({
          calories: acc.calories + Number(item.calories || 0),
          protein: acc.protein + Number(item.protein || 0),
          carbs: acc.carbs + Number(item.carbs || 0),
          fat: acc.fat + Number(item.fat || 0),
        }),
        { calories: 0, protein: 0, carbs: 0, fat: 0 }
      );

      // CÁLCULO EN VIVO DE TMB Y TDEE
      const metabolicData = useMemo(() => {
        const w = Number(profile.weight) || 0;
        const h = Number(profile.height) || 0;
        const a = Number(profile.age) || 0;

        const exItem = EXERCISE_LEVELS.find((e) => e.id === profile.exercise) || EXERCISE_LEVELS[1];
        const actItem = DAILY_ACTIVITY_LEVELS.find((d) => d.id === profile.dailyActivity) || DAILY_ACTIVITY_LEVELS[1];
        const freqObj = FREQUENCIES.find((f) => f.days === (profile.exerciseDays || 3)) || FREQUENCIES[1];

        const sportFactor = exItem.id === "none" ? 0.0 : Number((exItem.factor * freqObj.mult).toFixed(3));
        const act = Number((actItem.baseFactor + sportFactor).toFixed(3));

        const lossTarget = profile.weeklyLossKg === "" ? 0.5 : (Number(profile.weeklyLossKg) || 0);
        let deficitDaily = 0;

        if (w <= 0 || h <= 0 || a <= 0) {
          return { bmr: 0, tdee: 0, targetCals: 0, actMultiplier: act, sportFactor, deficitDaily: 0, weeklyLossKg: lossTarget };
        }

        // Fórmula Mifflin-St Jeor
        let bmr = (10 * w) + (6.25 * h) - (5 * a) + (profile.gender === "male" ? 5 : -161);
        let tdee = bmr * act;

        let targetCals = tdee;
        if (profile.objective === "deficit") {
          // 1 kg de grasa equivale aprox a 7,700 kcal.
          // Déficit diario = (pérdida_semanal_kg * 7700) / 7 = pérdida_semanal_kg * 1100 kcal/día
          deficitDaily = Math.round(lossTarget * 1100);
          targetCals -= deficitDaily;
        } else if (profile.objective === "bulk") {
          targetCals += 350;
        }

        return {
          bmr: Math.round(bmr),
          tdee: Math.round(tdee),
          targetCals: Math.max(Math.round(targetCals), 1000),
          deficitDaily,
          weeklyLossKg: lossTarget,
          actMultiplier: act,
          sportFactor
        };
      }, [profile]);

      const handleExerciseChange = (newExercise) => {
        const ex = EXERCISE_LEVELS.find((e) => e.id === newExercise) || EXERCISE_LEVELS[1];
        const daily = DAILY_ACTIVITY_LEVELS.find((d) => d.id === (profile.dailyActivity || "light")) || DAILY_ACTIVITY_LEVELS[1];
        const freqObj = FREQUENCIES.find((f) => f.days === (profile.exerciseDays || 3)) || FREQUENCIES[1];
        const sportFactor = ex.id === "none" ? 0.0 : Number((ex.factor * freqObj.mult).toFixed(3));
        const combined = Number((daily.baseFactor + sportFactor).toFixed(3));
        setProfile((prev) => ({
          ...prev,
          exercise: newExercise,
          activity: combined
        }));
      };

      const handleFrequencyChange = (newDays) => {
        const ex = EXERCISE_LEVELS.find((e) => e.id === (profile.exercise || "gym")) || EXERCISE_LEVELS[1];
        const daily = DAILY_ACTIVITY_LEVELS.find((d) => d.id === (profile.dailyActivity || "light")) || DAILY_ACTIVITY_LEVELS[1];
        const freqObj = FREQUENCIES.find((f) => f.days === newDays) || FREQUENCIES[1];
        const sportFactor = ex.id === "none" ? 0.0 : Number((ex.factor * freqObj.mult).toFixed(3));
        const combined = Number((daily.baseFactor + sportFactor).toFixed(3));
        setProfile((prev) => ({
          ...prev,
          exerciseDays: newDays,
          activity: combined
        }));
      };

      const handleDailyActivityChange = (newDailyActivity) => {
        const ex = EXERCISE_LEVELS.find((e) => e.id === (profile.exercise || "gym")) || EXERCISE_LEVELS[1];
        const daily = DAILY_ACTIVITY_LEVELS.find((d) => d.id === newDailyActivity) || DAILY_ACTIVITY_LEVELS[1];
        const freqObj = FREQUENCIES.find((f) => f.days === (profile.exerciseDays || 3)) || FREQUENCIES[1];
        const sportFactor = ex.id === "none" ? 0.0 : Number((ex.factor * freqObj.mult).toFixed(3));
        const combined = Number((daily.baseFactor + sportFactor).toFixed(3));
        setProfile((prev) => ({
          ...prev,
          dailyActivity: newDailyActivity,
          activity: combined
        }));
      };

      const selectedExercise = EXERCISE_LEVELS.find((e) => e.id === (profile.exercise || "gym")) || EXERCISE_LEVELS[1];
      const selectedDailyActivity = DAILY_ACTIVITY_LEVELS.find((d) => d.id === (profile.dailyActivity || "light")) || DAILY_ACTIVITY_LEVELS[1];
      const currentFrequency = FREQUENCIES.find((f) => f.days === (profile.exerciseDays || 3)) || FREQUENCIES[1];

      const calculateAutoGoals = () => {
        const { targetCals } = metabolicData;
        const w = Number(profile.weight) || 70;

        const targetProtein = Math.round(w * 2);
        const targetFat = Math.round((targetCals * 0.25) / 9);
        const targetCarbs = Math.max(Math.round((targetCals - (targetProtein * 4) - (targetFat * 9)) / 4), 0);

        setGoals({
          calories: targetCals,
          protein: targetProtein,
          carbs: targetCarbs,
          fat: targetFat
        });
      };

      const startCamera = async () => {
        setErrorMsg("");
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" }
          });
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
            setCameraActive(true);
          }
        } catch (err) {
          setErrorMsg("No se pudo acceder a la cámara. Asegúrate de estar en HTTPS o usa el botón 'Subir Foto / Cámara Celular'.");
        }
      };

      const stopCamera = () => {
        if (videoRef.current && videoRef.current.srcObject) {
          videoRef.current.srcObject.getTracks().forEach(track => track.stop());
          videoRef.current.srcObject = null;
        }
        setCameraActive(false);

      useEffect(() => {

      const capturePhoto = () => {
        if (!videoRef.current || !canvasRef.current) return;
        const video = videoRef.current;
        const canvas = canvasRef.current;
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.8);
        stopCamera();
        analyzeImageWithGemini(dataUrl);
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onloadend = () => {
          analyzeImageWithGemini(reader.result);
        };
        reader.readAsDataURL(file);
      };

      const parseSafeJson = (rawText) => {
        const cleaned = rawText.replace(/```json/gi, "").replace(/```/g, "").trim();
        const firstBrace = cleaned.indexOf("{");
        const lastBrace = cleaned.lastIndexOf("}");
        if (firstBrace !== -1 && lastBrace !== -1) {
          return JSON.parse(cleaned.substring(firstBrace, lastBrace + 1));
        }
        return JSON.parse(cleaned);
      };

      const callGeminiWithRetry = async (contentsPayload) => {
        const fallbackModels = [
          modelName,
          "gemini-3.8-flash",
          "gemini-3.8-flash-lite",
          "gemini-3.8-pro",
          "gemini-2.0-flash"
        ];
        const modelsToTry = [...new Set(fallbackModels)];
        let lastError = "";

        for (let m = 0; m < modelsToTry.length; m++) {
          const currentModel = modelsToTry[m];
          
          for (let attempt = 1; attempt <= 2; attempt++) {
            try {
              setStatusText(
                attempt > 1
                  ? `Servidor ocupado, reintentando con ${currentModel} (intento ${attempt})...`
                  : `Analizando nutrientes con ${currentModel}...`
              );

              const response = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/${currentModel}:generateContent?key=${apiKey}`,
                {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({
                    contents: contentsPayload,
                    generationConfig: { responseMimeType: "application/json" }
                  })
                }
              );

              const data = await response.json();

              if (response.ok && data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
                const rawText = data.candidates[0].content.parts[0].text;
                return parseSafeJson(rawText);
              }

              lastError = data.error?.message || "Error al procesar la respuesta de la IA";
              const lowerErr = lastError.toLowerCase();

              if (
                response.status === 503 ||
                response.status === 429 ||
                lowerErr.includes("demand") ||
                lowerErr.includes("overloaded") ||
                lowerErr.includes("unavailable")
              ) {
                await new Promise((res) => setTimeout(res, 1500 * attempt));
                continue;
              } else {
                break;
              }
            } catch (networkErr) {
              lastError = networkErr.message;
              await new Promise((res) => setTimeout(res, 1200));
            }
          }
        }
        throw new Error(lastError);
      };

      const analyzeImageWithGemini = async (base64DataUrl) => {
        if (!apiKey) {
          setShowKeyModal(true);
          setErrorMsg("Configura tu API Key de Gemini primero en el botón superior.");
          return;
        }

        setIsScanning(true);
        setErrorMsg("");
        setScanResult(null);

        try {
          const base64String = base64DataUrl.split(",")[1];
          const mimeType = base64DataUrl.substring(base64DataUrl.indexOf(":") + 1, base64DataUrl.indexOf(";"));

          const prompt = `Analiza esta imagen de comida. Identifica el plato o los ingredientes visibles, estima su tamaño de porción aproximado y calcula sus valores nutricionales totales.
Responde ÚNICAMENTE con un objeto JSON válido con esta estructura exacta:
{
  "name": "Nombre descriptivo del plato en español",
  "calories": 500,
  "protein": 30,
  "carbs": 45,
  "fat": 20,
  "details": "Breve desglose de los ingredientes estimados"
}`;

          const parsed = await callGeminiWithRetry([{
            parts: [
              { text: prompt },
              { inlineData: { mimeType: mimeType, data: base64String } }
            ]
          }]);

          setScanResult({ ...parsed, imagePreview: base64DataUrl });
        } catch (err) {
          setErrorMsg("Error al analizar: " + err.message);
        } finally {
          setIsScanning(false);
        }
      };

      const analyzeTextWithGemini = async () => {

Responde ÚNICAMENTE con un objeto JSON válido con esta estructura exacta:
{
  "name": "Nombre resumido del plato en español",
  "calories": 500,
  "protein": 30,
  "carbs": 45,
  "fat": 20,
  "details": "Desglose breve de la porción"
}`;

          const parsed = await callGeminiWithRetry([{ parts: [{ text: prompt }] }]);
          setScanResult(parsed);
          setTextPrompt("");

          setErrorMsg("Error al calcular: " + err.message);

                      <div className="bg-slate-900 p-2.5 rounded-xl border border-slate-800">
                        <span className="text-[10px] text-slate-400 block font-semibold">TMB (Metabolismo Basal)</span>
                        <span className="text-lg font-black text-teal-300">{metabolicData.bmr} <span className="text-xs font-normal text-slate-400">kcal</span></span>
                        <span className="text-[10px] text-slate-400 block mt-0.5">Calorías que quemas en reposo absoluto solo por vivir.</span>
                      </div>
                      <div className="bg-slate-900 p-2.5 rounded-xl border border-slate-800">
                        <span className="text-[10px] text-slate-400 block font-semibold">TDEE (Gasto Diario Total)</span>
                        <span className="text-lg font-black text-emerald-300">{metabolicData.tdee} <span className="text-xs font-normal text-slate-400">kcal</span></span>
                        <span className="text-[10px] text-slate-400 block mt-0.5">TMB multiplicada por tu actividad y ejercicio.</span>
                      </div>
                    </div>

                    <div className="p-2.5 rounded-xl bg-teal-500/10 border border-teal-500/30 flex items-center justify-between text-xs">
                      <div>
                        <span className="text-teal-300 font-bold block">Calorías Recomendadas:</span>
                        <span className="text-[11px] text-slate-400">
                          {profile.objective === "deficit"
                            ? `Déficit de -${metabolicData.deficitDaily} kcal (${metabolicData.weeklyLossKg || 0.5} kg/sem)`
                            : profile.objective === "bulk"
                            ? "Superávit de +350 kcal/día"
                            : "Mantenimiento exacto (TDEE)"}
                        </span>
                      </div>
                      <span className="text-xl font-extrabold text-teal-400">{metabolicData.targetCals} kcal</span>
                    </div>

                    <button
                      type="button"
                      onClick={calculateAutoGoals}
                      className="w-full bg-gradient-to-r from-teal-500 to-emerald-400 hover:from-teal-400 hover:to-emerald-300 text-slate-950 font-extrabold py-3 rounded-xl text-xs shadow-lg shadow-teal-500/20 active:scale-98 transition"
                    >
                      Aplicar a Mis Metas Diarias
                    </button>
                  </div>
                </div>

                {/* METAS DIARIAS ACTIVAS (EDITABLES SIN PROBLEMA DEL CERO) */}
                <div className="bg-slate-800/70 border border-slate-700 rounded-3xl p-4 space-y-3">
                  <h3 className="font-bold text-sm text-white">Metas Diarias Actuales</h3>
                  <div className="grid grid-cols-2 gap-3 text-xs">
                    <div>
                      <label className="text-slate-400 font-medium">Meta Calorías (kcal)</label>
                      <input
                        type="number"
                        value={goals.calories === "" ? "" : goals.calories}
                        onFocus={(e) => e.target.select()}
                        onChange={(e) => setGoals({ ...goals, calories: e.target.value === "" ? "" : Number(e.target.value) })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 mt-1 font-bold text-white focus:outline-none focus:border-teal-400"
                      />
                    </div>
                    <div>
                      <label className="text-blue-400 font-medium">Proteínas (g)</label>
                      <input
                        type="number"
                        value={goals.protein === "" ? "" : goals.protein}
                        onFocus={(e) => e.target.select()}
                        onChange={(e) => setGoals({ ...goals, protein: e.target.value === "" ? "" : Number(e.target.value) })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 mt-1 font-bold text-white focus:outline-none focus:border-teal-400"
                      />
                    </div>
                    <div>
                      <label className="text-orange-400 font-medium">Carbohidratos (g)</label>
                      <input
                        type="number"
                        value={goals.carbs === "" ? "" : goals.carbs}
                        onFocus={(e) => e.target.select()}
                        onChange={(e) => setGoals({ ...goals, carbs: e.target.value === "" ? "" : Number(e.target.value) })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 mt-1 font-bold text-white focus:outline-none focus:border-teal-400"
                      />
                    </div>
                    <div>
                      <label className="text-amber-400 font-medium">Grasas (g)</label>
                      <input
                        type="number"
                        value={goals.fat === "" ? "" : goals.fat}
                        onFocus={(e) => e.target.select()}
                        onChange={(e) => setGoals({ ...goals, fat: e.target.value === "" ? "" : Number(e.target.value) })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 mt-1 font-bold text-white focus:outline-none focus:border-teal-400"
                      />
                    </div>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* MODAL PARA CONFIGURAR API KEY Y MODELO */}
          {showKeyModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-700 rounded-3xl p-5 max-w-sm w-full space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-base flex items-center gap-2">
                    <i className="fa-solid fa-key text-teal-400"></i>
                    Configuración de Gemini API
                  </h3>
                  <button onClick={() => setShowKeyModal(false)} className="text-slate-400">✕</button>
                </div>
                
                <div className="space-y-1">
                  <label className="text-xs text-slate-400 font-semibold">API Key (Google AI Studio):</label>
                  <input
                    type="password"
                    placeholder="Pega aquí tu clave AIzaSy..."
                    defaultValue={apiKey}
                    id="apikey-input"
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-teal-400"
                  />
                  <p className="text-[11px] text-slate-500">Se guarda de forma segura en tu navegador.</p>
                </div>

                <div className="space-y-1">
                  <label className="text-xs text-slate-400 font-semibold">Modelo Principal:</label>
                  <input
                    type="text"
                    defaultValue={modelName}
                    id="model-input"
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-teal-300 font-mono focus:outline-none focus:border-teal-400"
                  />
                  <p className="text-[11px] text-slate-500">Incluye respaldo automático si hay alta demanda.</p>
                </div>

                <div className="flex gap-2">
                  <button
                    onClick={() => saveConfig(
                      document.getElementById("apikey-input").value,
                      document.getElementById("model-input").value
                    )}
                    className="flex-1 bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs"
                  >
                    Guardar Configuración
                  </button>
                  <button
                    onClick={() => saveConfig("", MODELO_POR_DEFECTO)}
                    className="bg-slate-800 text-red-400 px-3 py-2.5 rounded-xl text-xs"
                  >
                    Borrar
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* BARRA DE NAVEGACIÓN INFERIOR */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-900/95 backdrop-blur border-t border-slate-800 px-6 py-2.5 flex justify-between items-center z-30">
            <button onClick={() => setActiveTab("diario")} className={`flex flex-col items-center gap-1 text-xs ${activeTab === "diario" ? "text-teal-400 font-bold" : "text-slate-400"}`}>
              <i className="fa-solid fa-book-medical text-lg"></i>
              <span>Diario</span>
            </button>
            <button onClick={() => setActiveTab("camara")} className={`flex flex-col items-center gap-1 text-xs ${activeTab === "camara" ? "text-teal-400 font-bold" : "text-slate-400"}`}>
              <div className="w-12 h-12 -mt-6 rounded-full bg-gradient-to-tr from-teal-500 to-emerald-400 text-slate-950 flex items-center justify-center shadow-lg shadow-teal-500/30 border-4 border-slate-900">
                <i className="fa-solid fa-camera text-xl"></i>
              </div>
              <span>Cámara</span>
            </button>
            <button onClick={() => setActiveTab("estadisticas")} className={`flex flex-col items-center gap-1 text-xs ${activeTab === "estadisticas" ? "text-teal-400 font-bold" : "text-slate-400"}`}>
              <i className="fa-solid fa-chart-simple text-lg"></i>
              <span>Estadísticas</span>
            </button>
            <button onClick={() => setActiveTab("perfil")} className={`flex flex-col items-center gap-1 text-xs ${activeTab === "perfil" ? "text-teal-400 font-bold" : "text-slate-400"}`}>
              <i className="fa-solid fa-user text-lg"></i>
              <span>Perfil</span>
            </button>
          </nav>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
